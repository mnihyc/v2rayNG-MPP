name: Android CI and signed artifacts

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  ANDROID_ABIS: arm64-v8a;x86_64
  ANDROID_NDK_VERSION: 29.0.14206865

jobs:
  build-and-test:
    name: Test and build
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Preflight Android signing secrets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEYSTORE_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for variable in APP_KEYSTORE_BASE64 APP_KEYSTORE_PASSWORD \
            APP_KEYSTORE_ALIAS APP_KEY_PASSWORD; do
            [[ -n "${!variable}" ]] || {
              echo "required release secret is empty: ${variable}" >&2
              exit 1
            }
          done

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
          cache-dependency-path: V2rayNG/**/*.gradle*

      - name: Set up pinned Android SDK and NDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
        with:
          log-accepted-android-sdk-licenses: false
          packages: >-
            platforms;android-37
            build-tools;37.0.0
            platform-tools
            emulator
            ndk;29.0.14206865

      - name: Configure Android build
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > V2rayNG/local.properties
          chmod 755 V2rayNG/gradlew
          echo "NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build HEV for supported ABIs
        env:
          HEV_ABIS: arm64-v8a x86_64
        run: |
          set -euo pipefail
          ./compile-hevtun.sh
          mkdir -p V2rayNG/app/libs
          cp -R libs/. V2rayNG/app/libs/

      - name: Consume two Android archives from one frozen MPTUNNEL release
        id: mptunnel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/fetch-mptunnel-android.sh

      - name: Download pinned Xray AAR line
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          xray_tag="$(git -C AndroidLibXrayLite describe --tags --abbrev=0)"
          [[ "$xray_tag" =~ ^v[0-9] ]] || {
            echo "AndroidLibXrayLite submodule has no version tag" >&2
            exit 1
          }
          mkdir -p V2rayNG/app/libs
          gh release download "$xray_tag" \
            --repo 2dust/AndroidLibXrayLite \
            --pattern libv2ray.aar \
            --dir V2rayNG/app/libs
          test -s V2rayNG/app/libs/libv2ray.aar
          test "$(find V2rayNG/app/libs -maxdepth 1 -type f -name 'libv2ray*.aar' | wc -l)" = 1

      - name: Run MPP unit tests
        working-directory: V2rayNG
        run: |
          ./gradlew testFdroidDebugUnitTest \
            --tests 'com.v2ray.ang.mpp.*' \
            -PABI_FILTERS=x86_64 \
            -PUNIVERSAL_APK=false

      - name: Run x86_64 MPTUNNEL instrumentation
        uses: ReactiveCircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: >-
            cd V2rayNG &&
            ./gradlew connectedFdroidDebugAndroidTest
            -PABI_FILTERS=x86_64
            -PUNIVERSAL_APK=false
            -Pandroid.testInstrumentationRunnerArguments.class=com.v2ray.ang.mpp.MptunnelNativeInstrumentedTest
            -Pandroid.testInstrumentationRunnerArguments.mptunnelNativeVersion=${{ steps.mptunnel.outputs.version }}

      - name: Decode and validate release keystore
        if: startsWith(github.ref, 'refs/tags/')
        env:
          APP_KEYSTORE_BASE64: ${{ secrets.APP_KEYSTORE_BASE64 }}
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEYSTORE_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/android-release-keystore.jks"
          printf '%s' "$APP_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          test -s "$keystore"
          keytool -list \
            -keystore "$keystore" \
            -storepass "$APP_KEYSTORE_PASSWORD" \
            -alias "$APP_KEYSTORE_ALIAS" >/dev/null
          echo "ANDROID_RELEASE_KEYSTORE=$keystore" >> "$GITHUB_ENV"

      - name: Build exactly two ABI splits and one universal release APK
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: V2rayNG
        env:
          APP_KEYSTORE_PASSWORD: ${{ secrets.APP_KEYSTORE_PASSWORD }}
          APP_KEYSTORE_ALIAS: ${{ secrets.APP_KEYSTORE_ALIAS }}
          APP_KEY_PASSWORD: ${{ secrets.APP_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          ./gradlew licenseFdroidReleaseReport assembleFdroidRelease \
            -PABI_FILTERS="$ANDROID_ABIS" \
            -PUNIVERSAL_APK=true \
            -Pandroid.injected.signing.store.file="$ANDROID_RELEASE_KEYSTORE" \
            -Pandroid.injected.signing.store.password="$APP_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$APP_KEYSTORE_ALIAS" \
            -Pandroid.injected.signing.key.password="$APP_KEY_PASSWORD"

      - name: Verify signed release APK contract
        if: startsWith(github.ref, 'refs/tags/')
        env:
          MPTUNNEL_VERSION: ${{ steps.mptunnel.outputs.version }}
          MPTUNNEL_TAG: ${{ steps.mptunnel.outputs.tag }}
          MPTUNNEL_COMMIT: ${{ steps.mptunnel.outputs.commit }}
          MPTUNNEL_RELEASE_ID: ${{ steps.mptunnel.outputs.release_id }}
          MPTUNNEL_ARM64_ASSET: ${{ steps.mptunnel.outputs.arm64_asset }}
          MPTUNNEL_ARM64_ASSET_ID: ${{ steps.mptunnel.outputs.arm64_asset_id }}
          MPTUNNEL_ARM64_SHA256: ${{ steps.mptunnel.outputs.arm64_sha256 }}
          MPTUNNEL_X86_64_ASSET: ${{ steps.mptunnel.outputs.x86_64_asset }}
          MPTUNNEL_X86_64_ASSET_ID: ${{ steps.mptunnel.outputs.x86_64_asset_id }}
          MPTUNNEL_X86_64_SHA256: ${{ steps.mptunnel.outputs.x86_64_sha256 }}
        run: |
          .github/scripts/verify-release-apks.sh \
            V2rayNG/app/build/outputs/apk/fdroid/release \
            release

      - name: Upload exact signed release payload
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: signed-release-${{ github.sha }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish verified GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-and-test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout verification scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download exact signed release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-release-${{ github.sha }}
          path: release

      - name: Validate release identity and exact inventory
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          provenance=release/build-provenance.json
          test -f "$provenance"
          jq -e \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg tag "$RELEASE_TAG" \
            --arg commit "$RELEASE_COMMIT" '
              (.mptunnel.version) as $mptunnel_version |
              .schema_version == 2 and
              .repository == $repository and
              .tag == $tag and
              .commit == $commit and
              .application_id == "com.v2ray.ang.mpp.fdroid" and
              ($mptunnel_version | test("^(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$")) and
              .mptunnel.tag == ("v" + .mptunnel.version) and
              (.mptunnel.commit | test("^[0-9a-f]{40}$")) and
              (.mptunnel.release_id | type) == "number" and .mptunnel.release_id > 0 and
              (.mptunnel.assets | type) == "array" and
              (.mptunnel.assets | length) == 2 and
              ([.mptunnel.assets[].abi] | sort) == ["arm64-v8a", "x86_64"] and
              ([.mptunnel.assets[].asset_id] | unique | length) == 2 and
              all(.mptunnel.assets[];
                (keys | sort) == (["abi", "asset_id", "name", "sha256"] | sort) and
                (.asset_id | type) == "number" and .asset_id > 0 and
                (.sha256 | test("^[0-9a-f]{64}$")) and
                if .abi == "arm64-v8a" then
                  .name == ("mptunnel-" + $mptunnel_version + "-android-arm64.tar.gz")
                elif .abi == "x86_64" then
                  .name == ("mptunnel-" + $mptunnel_version + "-android-x86_64.tar.gz")
                else false end) and
              ([.apks[].abi] | sort) == ["arm64-v8a", "universal", "x86_64"] and
              all(.apks[]; .sha256 | test("^[0-9a-f]{64}$"))
            ' "$provenance" >/dev/null
          expected=.release-expected.txt
          actual=.release-actual.txt
          {
            jq -r '.apks[].name' "$provenance"
            printf '%s\n' SHA256SUMS build-provenance.json
          } | LC_ALL=C sort > "$expected"
          find release -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
            | LC_ALL=C sort > "$actual"
          test "$(wc -l < "$expected")" = 5
          test "$(uniq -d "$expected" | wc -l)" = 0
          diff -u "$expected" "$actual"
          if find release -mindepth 1 -maxdepth 1 ! -type f -print -quit \
            | grep -q .; then
            echo "release staging contains a non-regular entry" >&2
            exit 1
          fi
          (
            cd release
            sha256sum --check SHA256SUMS
          )

      - name: Revalidate source and frozen MPTUNNEL release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          provenance=release/build-provenance.json

          app_ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")"
          app_type="$(jq -er .object.type <<<"$app_ref")"
          app_sha="$(jq -er .object.sha <<<"$app_ref")"
          for _ in 1 2 3 4; do
            case "$app_type" in
              commit) break ;;
              tag)
                app_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${app_sha}")"
                app_type="$(jq -er .object.type <<<"$app_object")"
                app_sha="$(jq -er .object.sha <<<"$app_object")"
                ;;
              *) exit 1 ;;
            esac
          done
          test "$app_type" = commit
          test "$app_sha" = "$RELEASE_COMMIT"

          .github/scripts/revalidate-mptunnel-provenance.sh "$provenance"

      - name: Create owned draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "a GitHub Release already exists for $RELEASE_TAG" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" \
            --draft \
            --verify-tag \
            --generate-notes \
            --title "v2rayNG-MPP ${version}"
          gh release view "$RELEASE_TAG" --json databaseId,isDraft,tagName \
            > .release-created.json
          test "$(jq -r .isDraft .release-created.json)" = true
          test "$(jq -r .tagName .release-created.json)" = "$RELEASE_TAG"
          jq -er .databaseId .release-created.json > .release-created-by-run

      - name: Upload and freshly verify draft payload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mapfile -t payload < <(
            find release -mindepth 1 -maxdepth 1 -type f -print | LC_ALL=C sort
          )
          test "${#payload[@]}" = 5
          gh release upload "$RELEASE_TAG" "${payload[@]}"
          gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[].name' | LC_ALL=C sort > .release-assets.txt
          diff -u .release-expected.txt .release-assets.txt
          mkdir .release-download
          gh release download "$RELEASE_TAG" --dir .release-download
          while IFS= read -r asset; do
            cmp --silent "release/$asset" ".release-download/$asset" || {
              echo "freshly downloaded release asset differs: $asset" >&2
              exit 1
            }
          done < .release-expected.txt

      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" \
            > .release-published.json
          test "$(jq -r .draft .release-published.json)" = false
          test "$(jq -r .prerelease .release-published.json)" = false
          test "$(jq -r .immutable .release-published.json)" = true
          jq -r '.assets[].name' .release-published.json | LC_ALL=C sort \
            > .release-assets.txt
          diff -u .release-expected.txt .release-assets.txt
          jq -r '.assets[] | [.name, .digest] | @tsv' \
            .release-published.json > .release-digests.tsv
          while IFS=$'\t' read -r asset digest; do
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
              echo "published asset has no GitHub SHA-256 digest: $asset" >&2
              exit 1
            }
            actual="$(sha256sum "release/$asset" | awk '{print $1}')"
            test "$digest" = "sha256:$actual"
          done < .release-digests.tsv

      - name: Remove an owned failed draft
        if: ${{ always() && (failure() || cancelled()) }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          marker=.release-created-by-run
          [[ -f "$marker" ]] || exit 0
          release_id="$(cat "$marker")"
          [[ "$release_id" =~ ^[0-9]+$ ]] || exit 1
          current=.release-cleanup.json
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            > "$current" 2>/dev/null; then
            exit 0
          fi
          if [[ "$(jq -r .id "$current")" == "$release_id" \
            && "$(jq -r .tag_name "$current")" == "$RELEASE_TAG" \
            && "$(jq -r .draft "$current")" == true ]]; then
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/${release_id}"
          fi
